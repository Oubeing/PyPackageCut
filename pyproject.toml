[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyPackageCut"
version = "1.0.0"
description = "精准识别并移除 Python 打包产物中未被运行使用的文件，安全为打包结果瘦身。"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["python", "packaging", "pyinstaller", "nuitka", "slim", "optimize"]
authors = [
  { name = "PyPackageCut Contributors" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]
dependencies = [
  "PyQt5>=5.15",
  "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Oubeing/PyPackageCut"
Repository = "https://github.com/Oubeing/PyPackageCut"
